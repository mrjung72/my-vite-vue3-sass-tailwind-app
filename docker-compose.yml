services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    image: my-vite-vue-app:local
    container_name: my-vite-vue-frontend
    ports:
      - "8080:8080"
    environment:
      PORT: 8080
      BACKEND_URL: http://host.docker.internal:4000
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
